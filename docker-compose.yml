version: '3.8'

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/stimulation.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - haproxy
    restart: unless-stopped

  haproxy:
    image: haproxy:2.8-alpine
    ports:
      - "8080:8080"
      - "127.0.0.1:9000:9000"
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg
    depends_on:
      - worker1
      - worker2
      - worker3
    restart: unless-stopped

  worker1:
    build: .
    environment:
      - PORT=5001
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    restart: unless-stopped

  worker2:
    build: .
    environment:
      - PORT=5002
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    restart: unless-stopped

  worker3:
    build: .
    environment:
      - PORT=5003
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  redis_data:
