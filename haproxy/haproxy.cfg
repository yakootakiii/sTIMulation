global
    log stdout format raw local0
    maxconn 4096

defaults
    log     global
    mode    http
    option  httplog
    timeout connect  5s
    timeout client   60s
    timeout server   60s
    timeout tunnel   3600s

frontend stimulation_frontend
    bind *:8080
    default_backend stimulation_workers
    acl is_socketio path_beg /socket.io/
    use_backend socketio_workers if is_socketio

backend stimulation_workers
    balance roundrobin
    option httpchk GET /api/status
    http-check expect status 200
    server worker1 worker1:5001 check inter 5s rise 2 fall 3
    server worker2 worker2:5002 check inter 5s rise 2 fall 3
    server worker3 worker3:5003 check inter 5s rise 2 fall 3

backend socketio_workers
    balance source
    hash-type consistent
    option http-server-close
    timeout tunnel 3600s
    server worker1 worker1:5001 check inter 5s rise 2 fall 3
    server worker2 worker2:5002 check inter 5s rise 2 fall 3
    server worker3 worker3:5003 check inter 5s rise 2 fall 3

listen stats
    bind *:9000
    stats enable
    stats uri /haproxy-stats
    stats refresh 10s
    stats auth admin:changeme
